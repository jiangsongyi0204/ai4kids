  @keyframes twinkle { from{opacity:.35} to{opacity:1} }
  .planet { position:absolute; border-radius:50%; opacity:.5; }
  .planet.p1 { width:140px; height:140px; top:-40px; right:-40px;

  .planet.p2 { width:90px; height:90px; bottom:8%; left:-30px;

  .ring { position:absolute; width:220px; height:60px; top:16%; left:-90px;

  .topbar { display:flex; align-items:center; justify-content:space-between; gap:8px;

  .topbar .right { font-size:12px; color:#e6ebff; font-weight:600; }

  .hero h1 em { font-style:normal; color:#ffd76a; }
  .hero p { color:#cdd8ff; font-size:14px; line-height:1.7; max-width:600px; margin:0 auto; }
  .hero p b { color:#fff; }

  /* 进度卡 */
  .progress-card { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(8px); border-radius:22px; padding:14px 16px; margin:18px 0 6px;
    display:flex; align-items:center; gap:14px; }
  .progress-card .p-label { color:#fff; font-size:13px; font-weight:700; white-space:nowrap; }
  .progress-card .p-bar { flex:1; height:12px; background:rgba(255,255,255,.2); border-radius:20px; overflow:hidden; }
  .progress-card .p-bar i { display:block; height:100%; width:0.99%;
    background:linear-gradient(90deg,#ffd76a,#ff9ad5); border-radius:20px;

  .progress-card .p-num { color:#ffd76a; font-size:15px; font-weight:800; white-space:nowrap; }

  /* 分类筛选 */
  .cats { display:flex; gap:8px; overflow-x:auto; padding:14px 2px 4px; scrollbar-width:none; }
  .cats::-webkit-scrollbar { display:none; }
  .cats button { flex-shrink:0; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.14);

  .cats button:active { transform:scale(.95); }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:12px; margin-top:14px; }
  .job { position:relative; background:#fff; border-radius:20px; padding:16px 8px 12px; text-align:center;

  .job:active { transform:scale(.95); }
  .job .ic { font-size:38px; line-height:1; display:block; }
  .job .nm { font-size:13px; font-weight:800; color:#3a3f6e; margin-top:8px; display:block; }
  .job .cat-tag { font-size:10px; color:#a5abc9; font-weight:600; margin-top:3px; display:block; }

  /* 已点亮 */
  .job.lit { border-color:#ffd76a; box-shadow:0 10px 26px rgba(255,215,106,.35);
    background:linear-gradient(180deg,#fffdf5,#fff7e0); animation:glow 2.4s ease-in-out infinite; }
  @keyframes glow { 0%,100%{box-shadow:0 10px 26px rgba(255,215,106,.35)} 50%{box-shadow:0 10px 34px rgba(255,215,106,.65)} }
  .job.lit .badge { position:absolute; top:-11px; left:50%; transform:translateX(-50%);

  .job.lock .nm { color:#9aa0b8; }
  .job.lock .lock-ic { position:absolute; top:10px; right:10px; font-size:13px; opacity:.8; }

function load(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  biz:'商业财经', law:'法律公共', sci:'科学探索', media:'媒体传播', life:'生活服务'
};
const gridEl = document.getElementById('grid');
const catsEl = document.getElementById('cats');
let activeCat = 'all';

function renderCats(){
  catsEl.innerHTML = '<button class="on" data-c="all">✨ 全部</button>' +
    CATS.map(([k,n]) => `<button data-c="${k}">${n}</button>`).join('');
  catsEl.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ activeCat = b.dataset.c;
      catsEl.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
      renderGrid(); };
  });
}

function renderGrid(){
  const jobs = activeCat==='all' ? JOBS : JOBS.filter(j=>j[2]===activeCat);
  gridEl.innerHTML = jobs.map(j=>{
    const [name, emoji, cat, page, desc] = j;
    const lit = page && UNLOCKED.includes(page);
    if(lit){
      return `<div class="job lit" data-page="${page}" title="${desc}">
        <span class="badge">✨ 已点亮</span>
        <span class="ic">${emoji}</span>
        <span class="nm">${name}</span>
        <span class="cat-tag">${CAT_NAME[cat]}</span>
      </div>`;
    }
    return `<div class="job lock" data-name="${name}" title="未解锁">
        <span class="lock-ic">🔒</span>
        <span class="ic">${emoji}</span>
        <span class="nm">${name}</span>
        <span class="cat-tag">${CAT_NAME[cat]}</span>

  }).join('');

  gridEl.querySelectorAll('.job.lock').forEach(el=>{

/* Toast */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

document.getElementById('pnum').textContent = `已点亮 ${UNLOCKED.length} / 101`;
