name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/projects/ai4kids

            # 任一步失败立即中止（避免"假成功"）
            set -e

            # 0. 指定 Node.js 版本
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" || true
            nvm use 24 2>/dev/null || nvm use 18 2>/dev/null || nvm use default || true

            # 1. 强制对齐远端代码（丢弃本地修改 + 删除未跟踪文件，如 package-lock.json）
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # 2. 安装依赖
            npm install

            # 3. 在 HTML 中注入时间戳（缓存破坏）
            TIMESTAMP=$(date +%s)
            find public app -name "*.html" -exec sed -i "s|\.css\"|.css?v=${TIMESTAMP}\"|g; s|\.js\"|.js?v=${TIMESTAMP}\"|g" {} \; || true

            # 4. 重启服务（Express + ts-node，监听 80 端口）
            pm2 restart ai4kids 2>/dev/null || pm2 start npm --name ai4kids -- run start

            echo "✅ 部署完成 — $(date)"