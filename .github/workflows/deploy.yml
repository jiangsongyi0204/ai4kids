name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/projects/ai4kids

            # 任一步失败立即中止（避免"假成功"）
            set -e

            # 0. 指定 Node.js 版本
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" || true
            nvm use 24 2>/dev/null || nvm use 18 2>/dev/null || nvm use default || true

            # 1. 强制对齐远端代码（丢弃本地修改 + 删除未跟踪文件，如 package-lock.json）
            #    注意：不要再手工 git pull —— 本脚本第一件事就是 reset --hard，
            #    服务端工作区本来不该有本地改动（缓存破坏已改为运行时不改文件）
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # 2. 安装依赖
            npm install

            # 3. 重启服务（Node 自己监听 80 + 443，不依赖 Nginx）
            #    证书存在时 443 自动启用 HTTPS；证书不存在则只跑 HTTP，不会挂
            #    前端缓存破坏由 server/server.ts 在响应 HTML 时按资源 mtime 追加 ?v=，
            #    这里不再用 sed 改写 public/**.html（那样会让工作区一直是「已修改」）
            pm2 startOrRestart ecosystem.config.js --update-env
            pm2 save || true

            echo "✅ 部署完成 — $(date)"