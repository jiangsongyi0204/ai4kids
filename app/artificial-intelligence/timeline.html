<style>
  /* 页面独有样式：Tab 时间轴页（公共样式见 /css/common.css） */

  .tabs { display:flex; gap:10px; overflow-x:auto; padding:12px 0 14px; scrollbar-width:thin; }

  .tab .y { font-size:15px; font-weight:800; color:#2f4a8a; margin-top:4px; }
  .tab .t { font-size:10px; color:#8a93b8; margin-top:2px; white-space:nowrap; }

  .tab.active .y { color:#b97800; }

  .tab:hover { transform:translateY(-2px); }
  .tab:active { transform:scale(.96); }

  /* 课程内容卡片（与上方 Tab 卡片同宽） */
  .lesson { box-shadow:0 12px 30px rgba(120,160,210,.18); max-width:none; width:100%; margin:6px 0 20px;
    padding:14px 14px 22px; background:linear-gradient(180deg,#fffef9,#fff6e6); position:relative; }

  /* 课程右上角：进入实验室按钮 */
  .l-lab { position:absolute; top:12px; right:12px; z-index:6;
    background:linear-gradient(135deg,#b07cff,#7c3aed); color:#fff; font-size:12px; font-weight:800;

  .l-lab:hover { transform:translateY(-2px); box-shadow:0 8px 16px rgba(124,58,237,.55); }
  .l-lab:active { transform:scale(.95); }

  /* ===== 绘本化课程设计 ===== */
  .pb-cover { border-radius:24px; overflow:hidden; border:3px solid #fff;
    box-shadow:0 12px 26px rgba(120,160,210,.28); margin-bottom:16px; position:relative; }
  .pb-scene { position:relative; height:210px; overflow:hidden; }
  .pb-char { position:absolute; left:50%; bottom:24px; transform:translateX(-50%); font-size:92px; z-index:3;
    filter:drop-shadow(0 10px 14px rgba(0,0,0,.22)); animation:pbFloat 3.2s ease-in-out infinite; }
  .pb-year { position:absolute; left:12px; top:12px; z-index:4; background:rgba(255,255,255,.88); border:2px solid #fff;

  .pb-cloud { position:absolute; font-size:36px; opacity:.95; animation:pbDrift 6s ease-in-out infinite; z-index:2; }
  .pb-cloud.pbc1 { left:6%; top:14%; }
  .pb-cloud.pbc2 { left:74%; top:22%; animation-delay:2.2s; }
  .pb-spark { position:absolute; color:rgba(255,255,255,.95); font-size:16px; animation:pbTwinkle 2.4s ease-in-out infinite; z-index:2; }
  .pb-spark.s1 { left:22%; top:10%; }
  .pb-spark.s2 { left:64%; top:6%; font-size:12px; animation-delay:.8s; }
  .pb-spark.s3 { left:86%; top:40%; font-size:13px; animation-delay:1.4s; }
  .pb-deco { position:absolute; font-size:26px; z-index:2; filter:drop-shadow(0 4px 6px rgba(0,0,0,.16));
    animation:pbFloat 3.6s ease-in-out infinite; }
  .pb-hill { position:absolute; left:-8%; right:-8%; bottom:-36px; height:126px; border-radius:50% 50% 0 0; z-index:1; opacity:.95; }
  .pb-title { position:relative; z-index:4; text-align:center; background:#fff; padding:14px 16px 18px; }
  .pb-title h2 { font-size:24px; color:#1c2150; margin:0; }
  .pb-title .pb-tag { display:inline-block; margin-top:8px; font-size:12px; font-weight:800; color:#8a6d3b;
    background:#fff3d6; border:2px solid #ffe7a8; border-radius:30px; padding:3px 14px; }

  @keyframes pbFloat { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }
  @keyframes pbDrift { 0%,100%{ transform:translateX(0);} 50%{ transform:translateX(10px);} }
  @keyframes pbTwinkle { 0%,100%{ opacity:.3;} 50%{ opacity:1;} }

  /* 绘本分节卡片 */
  .sec { position:relative; overflow:hidden; padding:16px 20px 16px 58px; border-radius:22px; margin-top:14px;
    border:3px solid #fff; box-shadow:0 8px 18px rgba(120,160,210,.16); }
  .sec::before { content:''; position:absolute; left:0; top:0; bottom:0; width:42px; }
  .sec::after { content:attr(data-e); position:absolute; right:-6px; bottom:-18px; font-size:84px; opacity:.13;
    transform:rotate(-8deg); pointer-events:none; }
  .sec h4 { position:relative; z-index:1; }
  .sec h4::before { content:''; display:inline-block; width:30px; height:30px; border-radius:50%; background:#fff;
    box-shadow:0 2px 6px rgba(31,41,55,.14); flex-shrink:0; }
  .sec.story { background:linear-gradient(135deg,#fffdf2,#ffeebd); } .sec.story::before{ background:#ffc93c; } .sec.story h4{ color:#b97800; }
  .sec.teach { background:linear-gradient(135deg,#f1f7ff,#d9e9ff); } .sec.teach::before{ background:#6aa6ff; } .sec.teach h4{ color:#3a5bb0; }
  .sec.act { background:linear-gradient(135deg,#effbf3,#d3f2df); } .sec.act::before{ background:#43c878; } .sec.act h4{ color:#1d9e5c; }
  .sec.think { background:linear-gradient(135deg,#f7f1ff,#e6d9ff); } .sec.think::before{ background:#b28aff; } .sec.think h4{ color:#7a3fbf; }
  .sec.quiz { background:linear-gradient(135deg,#fff2f7,#ffdceb); } .sec.quiz::before{ background:#ff8fc0; } .sec.quiz h4{ color:#c44a8f; }
  .sec.person { background:linear-gradient(135deg,#fff7ec,#ffe7cd); } .sec.person::before{ background:#ffa94d; } .sec.person h4{ color:#b96a1e; }
  .pp { display:flex; align-items:center; gap:18px; position:relative; z-index:1; }
  .pp-img { width:96px; height:96px; border-radius:50%; object-fit:cover; border:4px solid #fff; flex-shrink:0;
    box-shadow:0 6px 14px rgba(120,160,210,.38); }
  .pp-fb { width:96px; height:96px; border-radius:50%; background:#ffd9a8; border:4px solid #fff; flex-shrink:0;
    display:none; align-items:center; justify-content:center; font-size:44px; box-shadow:0 6px 14px rgba(120,160,210,.38); }
  .pp-name { font-size:19px; font-weight:800; color:#8a4a12; }
  .pp-role { font-size:12px; color:#a0692f; margin-top:3px; line-height:1.6; }
  .pp-credit { font-size:9px; color:#c9a06b; margin-top:6px; }

  /* 感知机结构图卡片 */
  .sec.struct { background:linear-gradient(135deg,#eaf7f5,#cdeee8); }
  .sec.struct::before { background:#2bb3a3; }
  .sec.struct h4 { color:#147a6e; }
  .struct-intro { font-size:14px; line-height:1.85; color:#4a507a; }
  .formula { margin:10px 0 4px; background:#fff; border:2px dashed #2bb3a3; border-radius:14px; padding:10px 14px;
    font-family:Consolas,Menlo,monospace; font-size:13px; font-weight:700; color:#147a6e; text-align:center; }
  .cmp { display:flex; gap:8px; align-items:stretch; margin:12px 0 4px; }
  .cmp-col { flex:1; background:#fff; border:3px solid #fff; border-radius:16px; padding:8px 6px 4px;
    box-shadow:0 4px 10px rgba(31,41,55,.08); min-width:0; }
  .cmp-title { text-align:center; font-size:13px; font-weight:800; color:#3a4470; margin-bottom:2px; }
  .cmp-svg { width:100%; height:auto; display:block; }
  .cmp-arrow { align-self:center; font-size:22px; flex-shrink:0; }
  .cmp-tbl { width:100%; border-collapse:separate; border-spacing:0; margin-top:8px; background:#fff;
    border-radius:14px; overflow:hidden; box-shadow:0 4px 10px rgba(31,41,55,.08); font-size:12px; }
  .cmp-tbl th { background:#2bb3a3; color:#fff; padding:7px 8px; font-size:12px; }
  .cmp-tbl td { padding:7px 8px; text-align:center; border-top:1px solid #eef3f8; color:#3a4470; font-weight:600; }
  .sd { position:relative; margin-top:14px; background:#fff; border:3px solid #fff; border-radius:16px; padding:10px 8px 6px;
    box-shadow:0 4px 10px rgba(31,41,55,.08); }
  .sd-lab { position:absolute; top:10px; right:10px; z-index:2;
    background:linear-gradient(135deg,#b07cff,#7c3aed); color:#fff; font-size:11px; font-weight:800;
    padding:5px 12px; border-radius:30px; text-decoration:none; border:2px solid #fff;
    box-shadow:0 4px 10px rgba(124,58,237,.4); transition:.15s; }
  .sd-lab:hover { transform:translateY(-2px); box-shadow:0 8px 16px rgba(124,58,237,.55); }
  .sd-lab:active { transform:scale(.95); }
  .sd-title { text-align:center; font-size:14px; font-weight:800; color:#147a6e; }
  .sd svg { width:100%; height:auto; display:block; margin-top:4px; }
  .sd-note-wrap { text-align:center; margin-top:6px; }
  .sd-note { display:inline-block; text-align:center; font-size:12px; font-weight:700; color:#8a6d3b;
    background:#fff3d6; border-radius:30px; padding:4px 12px; }
  .struct-hist { margin-top:12px; font-size:13px; line-height:1.8; color:#4a507a; background:rgba(255,255,255,.6);
    border-radius:14px; padding:10px 12px; }
  @media (max-width:560px){ .cmp { flex-direction:column; } }
  .opt { border-radius:16px; }
  @media (max-width:520px){ .pb-scene{ height:168px; } .pb-char{ font-size:64px; } }

  /* 固定返回按钮 */
  .back-fixed { position:fixed; top:14px; left:14px; z-index:20; box-shadow:0 6px 18px rgba(120,160,210,.35); }

  /* Tab 容器（无卡片背景） */
  .tabs-wrap { padding:6px 0; }
</style>

<script>
/* =====================================================
   人工智能 · 时间轴课程数据
   每堂课：故事（story）→ 知识（teach）→ 动手（activity）
            → 小测试（quiz）→ 思考（think）
===================================================== */
const COURSES = [
{
  year:'1950', emoji:'💬', title:'图灵测试', tag:'一切的开始',
  brief:'图灵爷爷问了一个问题：机器能思考吗？',
  scene:['🤖','👤','🔍','💭','🗣️'],
  person:{ name:'艾伦·图灵', role:'计算机科学之父 · 提出图灵测试', img:'https://commons.wikimedia.org/wiki/Special:FilePath/Alan_Turing_Aged_16.jpg' },
  story:'1950 年，英国数学家阿兰·图灵在一篇论文里提出一个有趣的问题：「机器能像人一样思考吗？」他还设计了一个「模仿游戏」来检验：让你隔着屏幕，同时和一个人、一台机器聊天。如果你分不清哪个是机器、哪个是人，那就说明这台机器「会思考」！这就是著名的<b>图灵测试</b>，也是人工智能故事的起点。',
  teach:'人工智能 = 让机器学会做「需要人类智慧才能做的事」，比如看、听、说、思考、做决定。图灵爷爷用「聊天」来考验机器，是因为「像人一样好好说话」特别难——既要听懂意思，又要答得合理、有感情。',
  activity:{title:'动手：玩一次「模仿游戏」', steps:[
    '和爸爸妈妈三个人一起玩：一个人当「裁判」，另外两人当「选手」。',
    '其中一位选手要假装自己是「机器人」，说话尽量生硬、重复、没感情。',
    '裁判通过聊天猜：哪个是机器人，哪个是人类？',
    '换人再玩一次，体会「怎么说话才像人」！']},
  quiz:{q:'图灵测试想检验机器的什么本领？', options:[
    '会不会唱歌','能不能像人一样思考对话','会不会飞','有多大力气'], answer:1,
    explain:'图灵测试通过「聊天」来检验机器能不能像人一样思考和对话。'},
  think:'如果一台机器聊天聊得和你一模一样，你觉得它真的「会思考」吗？'
},
{
  year:'1956', emoji:'🌱', title:'人工智能诞生', tag:'种下种子',
  brief:'一群科学家开会，正式给「聪明的机器」起了名字',
  scene:['🌱','🏫','🧑‍🔬','📜','💡'],
  person:{ name:'约翰·麦卡锡', role:'「人工智能」命名者 · 达特茅斯会议发起人', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/John_McCarthy_Stanford.jpg/330px-John_McCarthy_Stanford.jpg' },
  story:'1956 年夏天，美国达特茅斯学院的一次会议上，一群科学家聚在一起，正式把「让机器变聪明」这门学问命名为——<b>人工智能（Artificial Intelligence）</b>。从此，AI 成了一门正式的科学，全世界的研究者都朝着「造一个会思考的机器」这个梦想出发。',
  teach:'「人工智能」拆开看，就是「人工（人造的）+ 智能（会思考的本领）」。科学家们想模仿人类的大脑，做出能学习、能推理、能解决问题的机器。它就像种下的一颗种子——今天你手机里的语音助手，都是这颗种子的后代！',
  activity:{title:'动手：找找身边的 AI', steps:[
    '和爸爸妈妈一起，找出身边 5 个用到「人工智能」的东西。',
    '比如：语音助手、人脸识别解锁、视频推荐、翻译软件、扫地机器人……',
    '把它们记在纸上，数一数你能找到几个，说说它们分别「聪明」在哪。']},
  quiz:{q:'「人工智能」这个名字是在哪一年正式诞生的？', options:[
    '1900 年','1956 年','2000 年','2020 年'], answer:1,
    explain:'1956 年达特茅斯会议，正式命名了「人工智能」这门学科。'},
  think:'为什么说人工智能像「一颗种子」？它后来长成了哪些「大树」？'
},
{
  year:'1957', emoji:'🧠', title:'感知机诞生', tag:'第一次「学习」',
  brief:'第一台会「学习」的机器，像一颗小小的神经元',
  scene:['🧠','🐶','🏓','✨','🔋'],
  struct:'perceptron',
  person:{ name:'弗兰克·罗森布拉特', role:'感知机发明者 · 机器学习先驱', img:'https://commons.wikimedia.org/wiki/Special:FilePath/Frank_Rosenblatt.jpg' },
  story:'1957 年，美国心理学家罗森布拉特发明了一个叫「感知机」（Perceptron）的机器。它像一个小小的「神经元」，能通过一次次练习学会分辨东西——比如学会分辨左边和右边。这是人类第一次造出会「学习」的机器，就像给人工智能装上了一颗小小的「学习大脑」。',
  teach:'感知机的原理，就像训练一只小狗狗：每次做对了，就奖励一下；做错了，就纠正一下。它通过无数次「做对→记住」，慢慢学会本领。今天我们常说的人工智能「深度学习」，就是从这颗小小的「感知机」一步步进化来的！',
  activity:{title:'动手：当一次「小感知机」', steps:[
    '让爸爸妈妈拿几张卡片，教你认几个新字或新图案。',
    '你故意记错几次，让爸爸妈妈纠正你，再记对。',
    '体会一下「练习 → 出错 → 纠正 → 学会」的过程，这就是机器学习的原理！']},
  quiz:{q:'感知机最厉害的本领是什么？', options:[
    '会唱歌','能通过练习学会分辨东西','会飞','会做饭'], answer:1,
    explain:'感知机是第一台能「通过练习学会分辨」的机器，是深度学习的祖先。'},
  think:'你自己是靠什么学会一件新本领的？和感知机「练习→纠正」的道理像不像？'
},
{
  year:'1966', emoji:'💬', title:'ELIZA', tag:'AI 学会聊天',
  lab:'/artificial-intelligence/eliza.html',
  brief:'世界上第一个会聊天的程序，假装成心理医生',
  scene:['🗣️','💊','🛋️','💛','🤖'],
  person:{ name:'约瑟夫·魏泽鲍姆', role:'第一个聊天机器人 ELIZA 的作者', img:'https://commons.wikimedia.org/wiki/Special:FilePath/Joseph_Weizenbaum.jpg' },
  story:'1966 年，麻省理工学院的约瑟夫·魏泽鲍姆写了一个叫 ELIZA 的程序。它假装成一位「心理医生」，你输入什么，它就用固定的句子回应你。其实它什么都不懂，可很多人和它聊着聊着，竟真的把它当成了「知心朋友」！这是世界上第一个聊天机器人。',
  teach:'ELIZA 其实很「笨」——它只是用一些规则，把你话里的关键词抓出来，再套进准备好的句子里。比如你说「我很难过」，它就问「你为什么难过？」。但它让人类第一次体验到「和机器聊天」的神奇，也为今天的聊天机器人埋下了伏笔。',
  activity:{title:'动手：测试一个「假医生」', steps:[
    '找找手机里的语音助手，故意对它说一句「我有点不开心」。',
    '观察它是怎么回应的——是关心你，还是只会回答「我不知道」？',
    '再想想：它比 1966 年的 ELIZA 聪明在哪里？']},
  quiz:{q:'ELIZA 是做什么的？', options:[
    '算数学题','和人聊天','画画','修电脑'], answer:1,
    explain:'ELIZA 是世界上第一个聊天机器人，会假装成心理医生和人聊天。'},
  think:'和机器人聊天，和和好朋友聊天，感觉有什么不一样？你希望机器人更懂你吗？'
},
{
  year:'1980', emoji:'🏥', title:'专家系统', tag:'AI 上班了',
  brief:'AI 把专家的经验装进电脑，当起了「专家顾问」',
  scene:['🏥','🩺','📋','💻','⚕️'],
  person:{ name:'爱德华·费根鲍姆', role:'「专家系统之父」· 知识工程开创者', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/27._Dr._Edward_A._Feigenbaum_1994-1997.jpg/330px-27._Dr._Edward_A._Feigenbaum_1994-1997.jpg' },
  story:'1980 年代，人工智能开始「上班」了！科学家们把很多专家的经验写进电脑，造出了「专家系统」——有看病的、有找矿的、有判断机器故障的。医生可以问它「这个病人可能是什么病」，它能给出专家级的建议。这是 AI 第一次真正走进现实世界帮人干活。',
  teach:'专家系统 = 「把专家的大脑装进电脑」。它靠的是「如果……那么……」的规则，比如「如果发烧 + 咳嗽，那么可能是感冒」。它不会自己思考新东西，但能记住成千上万条规则，比人记得多、算得快。',
  activity:{title:'动手：玩「如果……那么……」接龙', steps:[
    '和爸爸妈妈玩接龙：一个人说「如果……」，另一个人接「那么……」。',

const KEY = 'career101_done';
const CAREER = 'artificial-intelligence';
let done = load(KEY, {});
let doneSet = new Set(done[CAREER] || []);
function persist(){ done[CAREER] = [...doneSet]; save(KEY, done); }

let current = 0;
const params = new URLSearchParams(location.search);
const yearParam = params.get('year');
const foundIdx = COURSES.findIndex(c=>c.year === yearParam);
if(foundIdx >= 0) current = foundIdx;

const tabsEl = document.getElementById('tabs');
const lessonEl = document.getElementById('lesson');

function renderTabs(){
  tabsEl.innerHTML = COURSES.map((c,i)=>{
    const active = i===current;
    const isDone = doneSet.has(c.year);
    return `<div class="tab ${active?'active':''} ${isDone?'done':''}" data-i="${i}">
      <div class="e">${c.emoji}</div>
      <div class="y">${c.year}</div>
      <div class="t">${c.title}</div>
    </div>`;
  }).join('');
  tabsEl.querySelectorAll('.tab').forEach(el=>{
    el.onclick = ()=>{ current = +el.dataset.i; select(); };
  });
  const pr = document.getElementById('pr');
  if(pr) pr.textContent = doneSet.size;
  const act = tabsEl.querySelector('.tab.active');
  if(act) act.scrollIntoView({ block:'nearest', inline:'nearest' });
}

function renderLesson(){
  const c = COURSES[current];
  const doneNow = doneSet.has(c.year);
  const isLast = current === COURSES.length-1;
  const isFirst = current === 0;
  /* 绘本封面插图：天空渐变 + 山丘 + 漂浮场景 emoji + 主角 */
  const PAL = PALETTES[current % PALETTES.length];
  const scene = c.scene || [];
  const decoHtml = scene.map((e,i)=>{
    const p = DECO_POS[i % DECO_POS.length];
    return `<span class="pb-deco" style="left:${p.l};top:${p.t};animation-delay:${(i%4)*0.6}s">${e}</span>`;
  }).join('');
  const cover = `
    <div class="pb-cover">
      <div class="pb-scene" style="background:${PAL[0]}">
        <span class="pb-spark s1">✦</span><span class="pb-spark s2">✦</span><span class="pb-spark s3">✧</span>
        <div class="pb-cloud pbc1">☁️</div>
        <div class="pb-cloud pbc2">☁️</div>
        ${decoHtml}
        <div class="pb-hill" style="background:${PAL[1]}"></div>
        <div class="pb-year">${c.year} 年</div>
        <div class="pb-char">${c.emoji}</div>
      </div>
      <div class="pb-title">
        <h2>${current+1}. ${c.title}</h2>
        <span class="pb-tag">${c.tag} · 人工智能时间轴第 ${current+1} 站</span>
      </div>
    </div>`;
  const personCard = c.person ? `
    <div class="sec person" data-e="🧑">
      <h4>🧑 本课重要人物</h4>
      <div class="pp">
        <img class="pp-img" src="${c.person.img}" alt="${c.person.name}" loading="lazy"
          title="照片来源：维基共享资源" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="pp-fb">🧑</div>
        <div class="pp-info">
          <div class="pp-name">${c.person.name}</div>
          <div class="pp-role">${c.person.role}</div>
          <div class="pp-credit">📷 照片来源：维基共享资源（公有领域 / CC）</div>
        </div>
      </div>
    </div>` : '';
  const labBtn = c.lab ? `<a class="l-lab" href="${c.lab}">🔬 进入实验室</a>` : '';
  lessonEl.innerHTML = labBtn + cover + personCard + `
    <div class="sec story" data-e="📖"><h4>🕰️ 故事时间 · 那时候发生了什么？</h4><p>${c.story}</p></div>
    <div class="sec teach" data-e="💡"><h4>📖 知识小课堂 · 记住这个魔法！</h4><p>${c.teach}</p></div>
    ${c.struct==='perceptron'?PERCEPTRON_STRUCT_HTML:''}
    <div class="sec act" data-e="🛠️"><h4>🖐️ 动手小任务 · 亲自试一试</h4><ol>${c.activity.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>
    <div class="sec quiz" data-e="🎯" id="quizBox">
      <h4>❓ 小测试 · 你学会了吗？</h4>
      <p class="quiz-q">${c.quiz.q}</p>
      ${c.quiz.options.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}
      <div class="quiz-fb" id="fb"></div>
    </div>
    <div class="sec think" data-e="💭"><h4>💭 思考时间 · 和爸爸妈妈聊一聊</h4><p>${c.think}</p></div>
    <div class="l-nav">
      <button class="btn-prev" id="prevBtn" ${isFirst?'disabled style="opacity:.4"':''}>← 上一课</button>
      <button class="btn-next ${doneNow?'done':''}" id="nextBtn">${isLast?'🏁 完成全部课程':(doneNow?'✅ 已完成 · 下一课 →':'🎯 完成本课 · 下一课 →')}</button>
    </div>`;

  /* 小测试交互 */
  const opts = lessonEl.querySelectorAll('.opt');
  const fb = lessonEl.querySelector('#fb');
  let answered = false;
  opts.forEach(o=>{
    o.onclick = ()=>{
      if(answered) return; answered = true;
      const i = +o.dataset.i;
      opts.forEach(x=>x.disabled = true);
      if(i === c.quiz.answer){
        o.classList.add('right');
        fb.className = 'quiz-fb show ok';
        fb.innerHTML = `🎉 答对啦！${c.quiz.explain}`;
      } else {
        o.classList.add('wrong');
        opts[c.quiz.answer].classList.add('right');
        fb.className = 'quiz-fb show no';
        fb.innerHTML = `🤔 再想想哦！正确答案是 ${String.fromCharCode(65+c.quiz.answer)}。${c.quiz.explain}`;
      }
    };
  });

  lessonEl.querySelector('#prevBtn').onclick = ()=>{ if(!isFirst){ current--; select(); } };
  lessonEl.querySelector('#nextBtn').onclick = ()=>{
    if(!doneSet.has(c.year)){
      doneSet.add(c.year); persist();
      toast(`✅ 完成 ${c.year} 年 · ${c.title}！`);
    }
    if(isLast){ renderTabs(); renderLesson(); }
    else { current++; select(); }
  };
  lessonEl.scrollIntoView({ block:'start' });
}

function select(){
  renderTabs();
  renderLesson();
  history.replaceState(null, '', '?year=' + COURSES[current].year);
}

renderTabs();
renderLesson();
</script>
