  /* 页面独有样式：职业卡片网格（公共样式见 /css/common.css） */
  #app { max-width:1100px; }

  /* 职业卡片网格 */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:12px; margin-top:14px; }
  .job { position:relative; background:#fff; border-radius:22px; padding:16px 8px 12px; text-align:center;
    cursor:pointer; transition:.18s; border:3px solid #eaf3ff; user-select:none;
    box-shadow:0 8px 18px rgba(120,160,210,.18); }
  .job:hover { transform:translateY(-3px); box-shadow:0 12px 26px rgba(120,160,210,.28); }
  .job .ic { font-size:40px; line-height:1; display:block; }
  .job .nm { font-size:13px; font-weight:800; color:#3a4470; margin-top:8px; display:block; }
  .job .cat-tag { font-size:10px; color:#8aa0c9; font-weight:700; margin-top:3px; display:block; }

  /* 已点亮 */
  .job.lit { border-color:#ffd76a; box-shadow:0 10px 28px rgba(255,200,80,.45);
    background:linear-gradient(180deg,#fffdf5,#fff3cf); animation:glow 2.4s ease-in-out infinite; }
  @keyframes glow { 0%,100%{box-shadow:0 10px 28px rgba(255,200,80,.45)} 50%{box-shadow:0 10px 40px rgba(255,200,80,.72)} }
  .job.lit .badge { position:absolute; top:-11px; left:50%; transform:translateX(-50%);
    background:linear-gradient(135deg,#ffd76a,#ff9a3d); color:#7a3a00; font-size:11px; font-weight:800;
    padding:3px 10px; border-radius:20px; white-space:nowrap; box-shadow:0 4px 10px rgba(255,154,61,.4); }
  .job.lit .ic { animation:bounce 2s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

  /* 未点亮（灰色锁定） */
  .job.lock { background:#f0f3fa; border-color:#e2e8f4; filter:grayscale(1); opacity:.82; cursor:not-allowed; }
  .job.lock .ic { opacity:.55; }
  .job.lock .nm { color:#9aa0b8; }
  .job.lock .lock-ic { position:absolute; top:10px; right:10px; font-size:13px; opacity:.8; }
  .job.lock .cat-tag { color:#c2c7da; }

  /* 广告卡片 */
  .job.ad { display:block; text-decoration:none; border:2px dashed #ffb84d;
    background:linear-gradient(135deg,#fff7e6,#ffe9c2); box-shadow:0 8px 18px rgba(255,180,77,.28); }
  .job.ad .ad-tag { position:absolute; top:6px; right:8px; font-size:9px; color:#b45309;
    background:#ffe1a1; padding:1px 6px; border-radius:10px; font-weight:800; }
  .job.ad .ic { font-size:34px; }
  .job.ad .nm { color:#b45309; }
  .job.ad .cat-tag { color:#c98a3a; }

/* ============ 状态管理 ============ */
const KEY_UNLOCKED = 'career101_unlocked';
const KEY_DONE     = 'career101_done';

/* 已解锁的职业（点亮 = 可点击进入；未来的可在这里手动加） */
const UNLOCKED = ['artificial-intelligence'];
/* 每个职业已完成课程的年份集合：{ 'web-development': ['1989','1991',...] } */
const DONE = load(KEY_DONE, {});

/* ============ 渲染 ============ */
const CAT_NAME = {
  tech:'科技', health:'医疗', edu:'教育', art:'艺术', make:'建造',
  biz:'商业', law:'法律', sci:'科学', media:'媒体', life:'生活'
};
const gridEl = document.getElementById('grid');

/* 广告卡片：名称, emoji, 链接, 简介 */
const ADS = [
  ['DeepSeek', '🧠', 'https://www.deepseek.com', 'AI 大模型 · 免费对话'],
  ['VS Code', '💻', 'https://code.visualstudio.com', '免费代码编辑器'],
];
function adCard(j){
  const [name, emoji, url, desc] = j;
  return `<a class="job ad" href="${url}" target="_blank" rel="noopener" title="${desc}">
    <span class="ad-tag">广告</span>
    <span class="ic">${emoji}</span>
    <span class="nm">${name}</span>
    <span class="cat-tag">${desc}</span>
  </a>`;
}

function renderGrid(){
  const jobs = JOBS;
  const cards = jobs.map(j=>{
    const [name, emoji, cat, page, desc] = j;
    const lit = page && UNLOCKED.includes(page);
    if(lit){
      return `<div class="job lit" data-page="${page}" title="${desc}">
        <span class="badge">✨ 已点亮</span>
        <span class="ic">${emoji}</span>
        <span class="nm">${name}</span>
        <span class="cat-tag">${CAT_NAME[cat]}</span>
      </div>`;
    }
    return `<div class="job lock" data-name="${name}" title="未解锁">
        <span class="lock-ic">🔒</span>
        <span class="ic">${emoji}</span>
        <span class="nm">${name}</span>
        <span class="cat-tag">${CAT_NAME[cat]}</span>
      </div>`;
  });
  // 在网格随机位置插入两张广告卡片（每次刷新位置都不同）
  const n = cards.length;
  let a = Math.floor(Math.random()*(n+1)), b = Math.floor(Math.random()*(n+1));
  if(a === b) b = (b+1)%(n+1);                 // 保证两张不在同一位置
  const lo = Math.min(a,b), hi = Math.max(a,b);
  cards.splice(hi, 0, adCard(ADS[1]));         // 先插靠后的，避免下标错位
  cards.splice(lo, 0, adCard(ADS[0]));
  gridEl.innerHTML = cards.join('');

  gridEl.querySelectorAll('.job.lit').forEach(el=>{
    el.onclick = ()=>{ location.href = '/' + el.dataset.page + '/'; };
  });
  gridEl.querySelectorAll('.job.lock').forEach(el=>{
    el.onclick = ()=> toast(`🔒「${el.dataset.name}」还没点亮，先完成已点亮的职业再回来吧！`);
  });
}
