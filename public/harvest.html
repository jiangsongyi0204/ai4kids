<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>🏆 收获墙 - 人工智能简史 · AI星少年</title>
<link href="https://fonts.googleapis.cn/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         background:#f7f5f0; color:#2d2d2d; min-height:100vh; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 60px; }

  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .top a, .top button { font-size:14px; font-weight:700; color:#5b6ee8; text-decoration:none; padding:8px 16px;
                        border-radius:40px; background:#fff; border:none; cursor:pointer; font-family:inherit;
                        box-shadow:0 3px 12px rgba(0,0,0,.06); }
  .top a:hover, .top button:hover { transform:translateY(-1px); }

  .hero { position:relative; background:linear-gradient(135deg,#5B6EE8,#8FA8FF); border-radius:24px; color:#fff;
          text-align:center; padding:34px 24px; margin-bottom:18px; box-shadow:0 16px 44px -16px #5B6EE8; }
  .hero .ic { font-size:56px; display:block; margin-bottom:4px; filter:drop-shadow(0 4px 8px rgba(0,0,0,.18)); }
  .hero h1 { font-family:'Noto Serif SC',serif; font-size:32px; font-weight:900; }
  .hero p { font-size:14.5px; opacity:.95; line-height:1.8; margin-top:8px; max-width:760px; margin-left:auto; margin-right:auto; }
  .stats { margin-top:14px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .stats span { background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.35); border-radius:30px;
                padding:5px 16px; font-size:13px; font-weight:700; }

  .filters { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:18px; }
  .filters button { font-family:inherit; font-size:13px; font-weight:700; padding:7px 16px; border-radius:30px;
                    border:1px solid #e4e0d8; background:#fff; color:#6a7196; cursor:pointer; transition:all .15s; }
  .filters button:hover { border-color:#5b6ee8; color:#5b6ee8; }
  .filters button.on { background:linear-gradient(135deg,#5B6EE8,#8FA8FF); border-color:transparent; color:#fff; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px; }
  .card { background:#fff; border:1px solid rgba(0,0,0,.05); border-radius:18px; padding:16px 18px 18px;
          box-shadow:0 6px 22px rgba(0,0,0,.05); transition:transform .18s, box-shadow .18s; }
  .card:hover { transform:translateY(-3px); box-shadow:0 16px 34px -18px rgba(47,107,255,.55); }
  .who { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .ava { width:40px; height:40px; flex:0 0 auto; border-radius:50%; display:flex; align-items:center; justify-content:center;
         font-size:21px; background:linear-gradient(135deg,#EEF2FF,#E3EBFF); }
  .who .nm { flex:1; min-width:0; }
  .who .nm b { display:block; font-size:15px; color:#0d2259; font-family:'ZCOOL KuaiLe',cursive; font-weight:400;
               white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .who .nm i { font-style:normal; font-size:11.5px; color:#a3a8c2; }
  .badge { display:inline-block; font-size:11.5px; font-weight:800; color:#fff; padding:3px 11px; border-radius:20px;
           background:linear-gradient(135deg,#4F6DF5,#8FA8FF); margin-bottom:8px; }
  .badge small { font-weight:600; opacity:.9; }
  .txt { font-size:13.5px; line-height:1.85; color:#3a3f55; white-space:pre-wrap; word-break:break-word; }

  .msg { text-align:center; padding:56px 20px; color:#7a7f9e; font-size:14.5px; line-height:2; }
  .msg .big { font-size:52px; display:block; margin-bottom:8px; }
  .foot { text-align:center; color:#6a7196; font-size:13px; line-height:1.9; margin-top:28px; }
  @media (max-width:640px){ .hero h1{font-size:25px;} .wrap{padding:14px 12px 40px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="/">← 返回课程目录</a>
    <button type="button" onclick="load()">🔄 刷新</button>
  </div>

  <header class="hero">
    <span class="ic">🏆</span>
    <h1>收获墙</h1>
    <p>每一张卡片，都是小小学员读完一站后留下的收获。<br>点下面的小标签，看看同一站的同学们都学到了什么吧！</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="filters" id="filters"></div>
  <main class="grid" id="grid"></main>
  <div class="msg" id="msg" hidden></div>

  <div class="foot">✨ 想把自己的收获也贴上来？回到任意一课，在「🏁 回顾与完课」写下收获并保存即可。</div>
</div>

<script>
var ALL = [];            // 全部卡片
var curLesson = 0;       // 0 = 全部
var AVATARS = ['🐣','🦊','🐼','🐨','🐯','🦁','🐸','🐙','🦄','🐳','🦉','🐝','🐢','🦋','🐰','🐬'];

function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}
function avatarOf(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 9973;
    return AVATARS[h % AVATARS.length];
}
function timeText(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function showMsg(html) {
    var m = document.getElementById('msg');
    m.innerHTML = html;
    m.hidden = !html;
    document.getElementById('grid').innerHTML = '';
    document.getElementById('filters').innerHTML = '';
}

function renderFilters() {
    var box = document.getElementById('filters');
    var lessons = {};
    ALL.forEach(function (c) { lessons[c.lesson] = true; });
    var list = Object.keys(lessons).map(Number).sort(function (a, b) { return a - b; });
    if (!list.length) { box.innerHTML = ''; return; }

    var html = '<button type="button" class="' + (curLesson === 0 ? 'on' : '') + '" data-l="0">全部</button>';
    list.forEach(function (n) {
        html += '<button type="button" class="' + (curLesson === n ? 'on' : '') + '" data-l="' + n + '">第 ' + n + ' 站</button>';
    });
    box.innerHTML = html;
    box.querySelectorAll('button').forEach(function (b) {
        b.onclick = function () {
            curLesson = Number(b.getAttribute('data-l'));
            renderFilters();
            renderCards();
        };
    });
}

function renderCards() {
    var rows = curLesson ? ALL.filter(function (c) { return c.lesson === curLesson; }) : ALL;
    var grid = document.getElementById('grid');
    if (!rows.length) { showMsg('<span class="big">🌱</span>这一站还没有人贴收获，<br>快去写下你的第一张卡片吧～'); return; }
    grid.innerHTML = rows.map(function (c) {
        var who = c.lessonTitle ? '《' + esc(c.lessonTitle) + '》' : '';
        return '<article class="card">'
            + '<div class="who">'
            +   '<div class="ava">' + avatarOf(c.student) + '</div>'
            +   '<div class="nm"><b>' + esc(c.student) + '</b><i>' + timeText(c.createdAt) + '</i></div>'
            + '</div>'
            + '<div class="badge">第 ' + c.lesson + ' 站 <small>' + who + '</small></div>'
            + '<div class="txt">' + esc(c.content) + '</div>'
            + '</article>';
    }).join('');
}

async function load() {
    showMsg('<span class="big">⏳</span>正在读大家的收获…');
    try {
        var res = await fetch('/api/harvest');
        var data = await res.json();
        if (!data || !data.ok) throw new Error((data && data.error) || '读取失败');
        ALL = data.items || [];
        var s = data.stats || { total: 0, students: 0, lessons: 0 };
        document.getElementById('stats').innerHTML =
            '<span>📝 收获 ' + s.total + ' 条</span>' +
            '<span>👧 学员 ' + s.students + ' 位</span>' +
            '<span>🚩 覆盖 ' + s.lessons + ' 站</span>';
        if (!ALL.length) {
            showMsg('<span class="big">🏆</span>收获墙还是空空的～<br>去任意一课写下收获，揭幕第一张卡片吧！');
            return;
        }
        document.getElementById('msg').hidden = true;
        renderFilters();
        renderCards();
    } catch (e) {
        showMsg('<span class="big">😵</span>读了半天没读到收获…<br>' + esc(e.message || '网络开小差了') +
                '<br><button type="button" onclick="load()" style="margin-top:12px;font-family:inherit;font-size:14px;font-weight:700;color:#5b6ee8;padding:9px 22px;border-radius:30px;border:none;background:#fff;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.08);">🔄 再试一次</button>');
    }
}

load();
</script>
</body>
</html>
